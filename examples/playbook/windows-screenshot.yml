# Windows demo: screenshot the guest desktop and download the PNG.
# Fully windowless: a tiny C# tool is compiled ON the guest as a Windows
# (non-console) exe, so no CMD/console ever flashes. It runs in YOUR
# interactive session via a scheduled task (/IT) - WinRM shells (session 0)
# see no desktop. Run from the repo root.
- name: Windows screenshot demo
  hosts: win
  tasks:
    - name: Upload screenshot source
      copy: {src: examples/windows/Screenshot.cs, dest: C:/Temp/shot.cs}

    - name: Compile screenshot tool
      command: 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /target:winexe /out:C:\Temp\shot.exe C:\Temp\shot.cs'

    - name: Clean previous screenshot
      command: "Remove-Item C:/Temp/screen.png -Force -ErrorAction SilentlyContinue; exit 0"

    - name: Assert clean slate
      command: "(Test-Path C:/Temp/screen.png)"
      failed_when: '{{eq .result "True"}}'

    - name: Create interactive task
      command: 'schtasks /create /tn goaf-shot /tr "C:/Temp/shot.exe C:/Temp/screen.png" /sc once /st 23:59 /f /IT'

    - name: Run screenshot task
      command: "schtasks /run /tn goaf-shot"

    - name: Wait for PNG
      command: "(Test-Path C:/Temp/screen.png)"
      retries: 12
      delay: 5
      until: '{{eq .result "True"}}'

    - name: Download screenshot
      fetch: {src: C:/Temp/screen.png, dest: ./screenshots/}

    - name: Cleanup task
      command: "schtasks /delete /tn goaf-shot /f"
